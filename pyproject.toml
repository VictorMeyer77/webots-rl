[project]
name = "webots-rl"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[dependency-groups]
dev = [
    "corl[train]",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0"
]

[tool.uv.sources]
corl = { workspace = true }

[tool.uv.workspace]
members = [
    "backtrain",
    "corl",
    "projects"
]

[tool.pytest.ini_options]
testpaths = ["backtrain/tests", "corl/tests"]
pythonpath = ["backtrain", "corl"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["backtrain/app", "corl/corl"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
ignore_missing_imports = true
no_strict_optional = true
explicit_package_bases = true
exclude = ["build/"]

[[tool.mypy.overrides]]
# mlflow has no stubs; its absence prevents mypy from fully resolving the
# Trainer base class, causing cascading [has-type] errors in all subclasses
# that reference inherited attributes like last_checkpoint_transition.
module = [
    "corl.corl.trainer.algorithm.discrete.*",
    "corl.corl.trainer.algorithm.continuous.*",
]
disable_error_code = ["has-type"]
