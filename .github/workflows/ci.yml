name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Lint (ruff)
        run: uvx ruff check .

      - name: Format check (ruff)
        run: uvx ruff format --check .

      - name: Import sort check (isort)
        run: uvx isort --check-only --profile black .

      - name: Type check (mypy)
        run: uv run mypy --ignore-missing-imports --no-strict-optional --explicit-package-bases corl/corl backtrain/app
        continue-on-error: true

      - name: Tests
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true
